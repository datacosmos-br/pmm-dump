version: '3.8'

services:
  clickhouse-standalone:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "19000:9000"
      - "18123:8123"
    environment:
      CLICKHOUSE_DB: pmm
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - ./setup/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse-cluster-shard1:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "19001:9000"
      - "18124:8123"
    environment:
      CLICKHOUSE_DB: pmm
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - ./setup/clickhouse/cluster-shard1.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./setup/clickhouse/init-cluster.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse-cluster-shard2:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "19002:9000"
      - "18125:8123"
    environment:
      CLICKHOUSE_DB: pmm
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - ./setup/clickhouse/cluster-shard2.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./setup/clickhouse/init-cluster.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    ports:
      - "18428:8428"
    command:
      - "-retentionPeriod=30d"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: pmm
      POSTGRES_PASSWORD: pmm
      POSTGRES_DB: pmm-managed
    volumes:
      - ./setup/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmm -d pmm-managed"]
      interval: 5s
      timeout: 3s
      retries: 10

  pmm-server-mock:
    image: mockserver/mockserver:5.15.0
    ports:
      - "18080:1080"
    environment:
      MOCKSERVER_SERVER_PORT: 1080
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mockserver.json
    volumes:
      - ./setup/mockserver:/config:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1080/mockserver/status"]
      interval: 5s
      timeout: 3s
      retries: 10
